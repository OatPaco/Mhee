<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metronome</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Space+Mono:wght@400;700&display=swap');
  :root,body[data-theme="black"]{--bg:#0e0d12;--bg2:#1c1a26;--panel:#16151c;--ink:#f4f0e8;--muted:#6f6a7d;--accent:#e8554e;--accent2:#f0c33c;--beat:#2a2834;--line:#26242f;--soft:#7a8cc4;}
  body[data-theme="yellow"]{--bg:#1a1505;--bg2:#2e2608;--panel:#211c08;--ink:#fdf6df;--muted:#9a8c5a;--accent:#f5a623;--accent2:#ffe14d;--beat:#352c10;--line:#3d3315;--soft:#c9a84e;}
  body[data-theme="red"]{--bg:#160808;--bg2:#2a0e0e;--panel:#1e0c0c;--ink:#f7e9e6;--muted:#9a6a64;--accent:#ff5247;--accent2:#ff9b52;--beat:#321414;--line:#3a1818;--soft:#d98a7e;}
  body[data-theme="green"]{--bg:#08130c;--bg2:#0e2616;--panel:#0c1d12;--ink:#e8f6ec;--muted:#6a9a7c;--accent:#2ecc71;--accent2:#a8e063;--beat:#143020;--line:#183a26;--soft:#6fcf97;}
  body[data-theme="blue"]{--bg:#070f1a;--bg2:#0e1e33;--panel:#0c1626;--ink:#e6f0fb;--muted:#647d9a;--accent:#3a8ee8;--accent2:#4dd0e1;--beat:#142840;--line:#18324a;--soft:#7eb6e0;}
  body[data-theme="purple"]{--bg:#120a1a;--bg2:#22102e;--panel:#190d24;--ink:#f1e9f7;--muted:#8a6a9a;--accent:#a855f7;--accent2:#e879c9;--beat:#2a1438;--line:#321842;--soft:#c79ee0;}
  body[data-theme="brown"]{--bg:#150f0a;--bg2:#281c12;--panel:#1d150d;--ink:#f4ece2;--muted:#9a8470;--accent:#c47e3a;--accent2:#e0b063;--beat:#322414;--line:#3a2c18;--soft:#c9a87e;}
  body[data-theme="beige"]{--bg:#e8e0d0;--bg2:#f2ecdf;--panel:#fbf6ec;--ink:#3a322a;--muted:#9a8c78;--accent:#c4783a;--accent2:#d9a441;--beat:#e6ddca;--line:#d8cdb6;--soft:#b08d5e;}
  body[data-theme="neon"]{--bg:#05060a;--bg2:#0a0e1a;--panel:#0b0d14;--ink:#eafff7;--muted:#5a7a8a;--accent:#ff2bd6;--accent2:#2bff88;--beat:#12182a;--line:#1a2440;--soft:#2be0ff;}
  body[data-theme="jungle"]{--bg:#0a1408;--bg2:#142810;--panel:#0e1d0b;--ink:#eef6e2;--muted:#7a9a5a;--accent:#7cb342;--accent2:#ffca28;--beat:#1c3014;--line:#243a18;--soft:#aed581;}
  body[data-theme="industrial"]{--bg:#131416;--bg2:#212427;--panel:#1a1c1f;--ink:#e8eaec;--muted:#7a8084;--accent:#ff7043;--accent2:#90a4ae;--beat:#2a2e32;--line:#33383c;--soft:#b0bec5;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(circle at 50% -10%,var(--bg2) 0%,var(--bg) 55%);color:var(--ink);font-family:'Space Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden;transition:background .3s;}
  .theme-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .theme-row label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .theme-row select{flex:1;background:var(--beat);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:'Space Mono';font-size:13px;cursor:pointer;}
  .theme-row select option{background:var(--panel);}
  .float-pill{position:fixed;top:0;left:0;right:0;z-index:1000;display:none;align-items:center;justify-content:center;gap:16px;background:color-mix(in srgb, var(--panel) 70%, transparent);backdrop-filter:blur(10px);border:none;border-bottom:1px solid var(--line);border-radius:0;padding:12px 20px;box-shadow:0 12px 40px -12px #000;}
  .float-pill.show{display:flex;}
  .fp-bpm{font-family:'Fraunces',serif;font-size:30px;font-weight:500;line-height:1;color:var(--ink);min-width:46px;text-align:center;display:inline-block;transform-origin:center;}
  .fp-bpm.pulse-down{animation:fpDown .18s ease-out;}
  .fp-bpm.pulse-beat{animation:fpBeat .14s ease-out;}
  @keyframes fpDown{0%{transform:scale(1.4);color:var(--accent2);}100%{transform:scale(1);color:var(--ink);}}
  @keyframes fpBeat{0%{transform:scale(1.2);color:var(--accent);}100%{transform:scale(1);color:var(--ink);}}
  .fp-btn{background:var(--accent);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1;}
  .fp-btn:hover{filter:brightness(1.1);}
  .fp-btn.playing{background:var(--beat);border:1px solid var(--accent);color:var(--accent);}
  .fp-info{display:flex;flex-direction:column;gap:2px;}
  .fp-part{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:.5px;}
  .fp-detail{font-size:10px;color:var(--muted);letter-spacing:.5px;}
  .shell{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:30px 26px 34px;box-shadow:0 30px 80px -30px #000,inset 0 1px 0 #ffffff10;position:relative;}
  h1{font-family:'Fraunces',serif;font-weight:300;font-size:32px;letter-spacing:-.5px;}
  h1 b{font-weight:700;font-style:italic;color:var(--accent2);}
  .sub{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px;}

  .bpm-wrap{text-align:center;margin-bottom:6px;}
  .bpm{font-family:'Fraunces',serif;font-size:74px;font-weight:500;line-height:.9;transition:color .08s;display:inline-block;transform-origin:center;}
  .bpm.pulse-down{animation:bpmDown .18s ease-out;}
  .bpm.pulse-beat{animation:bpmBeat .14s ease-out;}
  @keyframes bpmDown{0%{transform:scale(1.32);color:var(--accent2);}100%{transform:scale(1);color:var(--ink);}}
  @keyframes bpmBeat{0%{transform:scale(1.14);color:var(--accent);}100%{transform:scale(1);color:var(--ink);}}
  .bpm .unit{font-size:14px;color:var(--muted);font-family:'Space Mono';letter-spacing:2px;display:block;margin-top:4px;}
  .nowplaying{text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px;min-height:16px;margin-bottom:8px;}
  .nowplaying b{color:var(--accent2);}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--line);border-radius:4px;outline:none;margin:14px 0 8px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--panel);}
  .bpm-btns{display:flex;justify-content:center;gap:8px;margin-bottom:18px;}
  .bpm-btns button{background:var(--beat);color:var(--ink);border:1px solid var(--line);width:46px;height:36px;border-radius:10px;font-family:'Space Mono';font-size:14px;cursor:pointer;transition:.15s;}
  .bpm-btns button:hover{background:#34313f;}

  /* parts strip */
  .parts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .part-tab{background:var(--beat);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer;transition:.15s;color:var(--muted);}
  .part-tab.active{border-color:var(--accent2);color:var(--ink);background:#241f17;}
  .part-tab.playing{box-shadow:0 0 0 2px var(--accent2);}

  .section{background:var(--beat);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
  .sec-head{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .prow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px;}
  .prow label{width:90px;flex-shrink:0;color:var(--muted);font-size:11px;}
  .prow input[type=number]{width:64px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Space Mono';font-size:13px;}
  .prow select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Space Mono';font-size:12px;cursor:pointer;}
  .prow .hintnote{color:var(--muted);font-size:10px;}

  .grid-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .grid-label span{color:var(--muted);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;}
  .mini-btn{background:var(--beat);color:var(--accent2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-family:'Space Mono';font-size:11px;cursor:pointer;transition:.15s;}
  .mini-btn:hover{background:#34313f;}
  .mini-btn:disabled{opacity:.35;cursor:not-allowed;}
  .group{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
  .group-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .group-tag{font-size:10px;color:var(--accent2);letter-spacing:1px;width:54px;flex-shrink:0;}
  .group-sel{flex:1;background:var(--beat);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-family:'Space Mono';font-size:12px;cursor:pointer;}
  .group-sel option{background:var(--panel);}
  .group-del{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px;flex-shrink:0;}
  .group-del:hover{color:var(--accent);}
  .vcount{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);}
  .vcount select{background:var(--beat);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-family:'Space Mono';font-size:10px;cursor:pointer;}

  .dots{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:14px;min-height:38px;padding:6px 0;}
  .dot{border-radius:50%;cursor:pointer;border:1px solid var(--line);background:var(--beat);transition:transform .05s,box-shadow .05s,background .12s,border-color .12s;position:relative;flex-shrink:0;}
  .dot.main{width:31px;height:31px;}
  .dot.sub{width:17px;height:17px;}
  .dot.s-accent{background:var(--accent2);border-color:var(--accent2);}
  .dot.s-normal{background:var(--accent);border-color:var(--accent);}
  .dot.s-soft{background:var(--soft);border-color:var(--soft);}
  .dot.s-mute{background:transparent;border-color:var(--line);border-style:dashed;}
  .dot.flash{transform:scale(1.4);box-shadow:0 0 16px currentColor;}
  .dot.main.flash{box-shadow:0 0 22px currentColor;}
  .legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px;font-size:10px;color:var(--muted);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  .row{display:flex;gap:12px;margin-bottom:14px;}
  .field{flex:1;background:var(--beat);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
  .field label{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
  .field select{width:100%;background:transparent;color:var(--ink);border:none;outline:none;font-family:'Space Mono';font-size:14px;cursor:pointer;}
  .field select option{background:var(--panel);}

  .vol-block{background:var(--beat);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;}
  .vol-row{display:flex;align-items:center;gap:12px;margin:12px 0;}
  .vol-name{font-size:11px;width:64px;flex-shrink:0;color:var(--ink);}
  .vol-name i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .vmini{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:var(--line);border-radius:4px;outline:none;margin:0;}
  .vmini::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);cursor:pointer;border:4px solid var(--beat);}
  .vmini::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);cursor:pointer;border:4px solid var(--beat);}
  .vol-val{font-size:11px;color:var(--muted);width:24px;text-align:right;flex-shrink:0;}

  .start{width:100%;padding:18px;border:none;border-radius:16px;cursor:pointer;background:var(--accent);color:#fff;font-family:'Fraunces';font-size:22px;font-weight:500;letter-spacing:.5px;transition:.15s;}
  .start:hover{filter:brightness(1.08);}
  .start.playing{background:var(--beat);border:1px solid var(--accent);color:var(--accent);}
  .tap{margin-top:12px;width:100%;padding:13px;border:1px dashed var(--line);border-radius:14px;background:transparent;color:var(--muted);font-family:'Space Mono';font-size:12px;letter-spacing:1px;cursor:pointer;transition:.15s;}
  .tap:hover{color:var(--ink);border-color:var(--accent2);}
</style>
</head>
<body data-theme="black">
<div class="float-pill" id="floatPill">
  <button class="fp-btn" id="fpBtn" title="Start/Stop">&#9632;</button>
  <div class="fp-bpm" id="fpBpm">120</div>
  <div class="fp-info">
    <div class="fp-part" id="fpPart">Part 1</div>
    <div class="fp-detail" id="fpDetail">Bar 1/1 &middot; G1 b1</div>
  </div>
  <button class="fp-btn" id="fpNext" title="Next song" style="display:none;background:var(--accent2);color:#000;">&#9197;</button>
</div>
<div class="shell">
  <h1>Metro<b>nome</b></h1>
  <div class="sub"></div>
  <div class="theme-row">
    <label>Theme</label>
    <select id="themeSel">
      <option value="black" selected>Black</option>
      <option value="yellow">Yellow</option>
      <option value="red">Red</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
      <option value="purple">Purple</option>
      <option value="brown">Brown</option>
      <option value="beige">Beige</option>
      <option value="neon">Neon</option>
      <option value="jungle">Jungle</option>
      <option value="industrial">Industrial</option>
    </select>
  </div>

  <div class="section">
    <div class="sec-head" style="display:flex;justify-content:space-between;align-items:center;">
      <span id="libTitle">Library</span>
      <span style="display:flex;gap:6px;">
        <button class="mini-btn" id="tabSongs">Songs</button>
        <button class="mini-btn" id="tabSets">Setlists</button>
      </span>
    </div>

    <!-- SONGS panel -->
    <div id="songsPanel">
      <div class="prow" style="gap:6px;">
        <input type="text" id="songName" placeholder="Song name" style="flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Space Mono';font-size:12px;">
        <button class="mini-btn" id="saveSong">Save current</button>
      </div>
      <select id="songList" size="4" style="width:100%;margin-top:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px;font-family:'Space Mono';font-size:12px;"></select>
      <div class="prow" style="gap:6px;flex-wrap:wrap;margin-top:8px;">
        <button class="mini-btn" id="loadSong">Load</button>
        <button class="mini-btn" id="renameSong">Rename</button>
        <button class="mini-btn" id="delSong">Delete</button>
        <button class="mini-btn" id="addToSet">Add to setlist &rarr;</button>
      </div>
      <div class="prow" style="gap:6px;flex-wrap:wrap;margin-top:4px;">
        <button class="mini-btn" id="exportSong">Export song</button>
        <button class="mini-btn" id="exportAll">Export all</button>
        <button class="mini-btn" id="importBtn">Import file</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </div>

    <!-- SETLISTS panel -->
    <div id="setsPanel" style="display:none;">
      <div class="prow" style="gap:6px;">
        <select id="setSelect" style="flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Space Mono';font-size:12px;"></select>
        <button class="mini-btn" id="newSet">New</button>
        <button class="mini-btn" id="delSet">Del</button>
      </div>
      <select id="setSongs" size="5" style="width:100%;margin-top:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px;font-family:'Space Mono';font-size:12px;"></select>
      <div class="prow" style="gap:6px;flex-wrap:wrap;margin-top:8px;">
        <button class="mini-btn" id="setUp">&uarr; Up</button>
        <button class="mini-btn" id="setDown">&darr; Down</button>
        <button class="mini-btn" id="setRemove">Remove</button>
        <button class="mini-btn" id="playSet">Play setlist</button>
      </div>
    </div>
  </div>

  <div class="bpm-wrap"><div class="bpm" id="bpmVal">120<span class="unit">BPM</span></div></div>
  <div class="nowplaying" id="nowPlaying"></div>
  <input type="range" id="bpmSlider" min="30" max="240" value="120">
  <div class="bpm-btns"><button data-d="-5">-5</button><button data-d="-1">-1</button><button data-d="1">+1</button><button data-d="5">+5</button></div>

  <button class="start" id="startBtn">Start</button>
  <button class="tap" id="tapBtn">TAP TEMPO</button>

  <div style="height:18px;"></div>

  <!-- create-parts entry (simple mode) -->
  <div id="simpleBar" class="grid-label"><span>Simple metronome &mdash; loops one pattern</span><button id="createParts" class="mini-btn">Create parts</button></div>

  <!-- transport / sequence options (parts mode only) -->
  <div class="section partsUI" id="seqSection" style="display:none;">
    <div class="sec-head">Sequence</div>
    <div class="prow"><label>Count-in</label>
      <select id="countIn"><option value="0">None</option><option value="1">1 bar</option><option value="2">2 bars</option></select>
    </div>
    <div class="prow"><label>When finished</label>
      <select id="endMode"><option value="once">Play once</option><option value="loop" selected>Loop sequence</option></select>
    </div>
  </div>

  <!-- parts (parts mode only) -->
  <div class="grid-label partsUI" id="partsHead" style="display:none;"><span>Parts</span><div style="display:flex;gap:6px;"><button id="addPart" class="mini-btn">+ Add part</button><button id="exitParts" class="mini-btn">Remove all</button></div></div>
  <div class="parts partsUI" id="partsStrip" style="display:none;"></div>

  <!-- selected part settings (parts mode only) -->
  <div class="section partsUI" id="partSettings" style="display:none;">
    <div class="sec-head" id="partSecHead">Part 1 settings</div>
    <div class="prow"><label>Repeat bars</label><input type="number" id="partBars" min="1" max="64" value="2"></div>
    <div class="prow"><label>Start tempo</label><input type="number" id="partTempoA" min="30" max="240" value="120"><span class="hintnote">BPM</span></div>
    <div class="prow"><label>End tempo</label><input type="number" id="partTempoB" min="30" max="240" value="120"><span class="hintnote">BPM (= start = no ramp)</span></div>
  </div>

  <!-- beat groups for the selected part / pattern -->
  <div class="grid-label"><span id="groupsHead">Beat groups</span><button id="addGroup" class="mini-btn">+ Add group</button></div>
  <div id="groups"></div>
  <div class="dots" id="dots"></div>
  <div class="legend">
    <span><i style="background:var(--accent2)"></i>Accent</span>
    <span><i style="background:var(--accent)"></i>Normal</span>
    <span><i style="background:var(--soft)"></i>Soft</span>
    <span><i style="border:1px dashed var(--line)"></i>Mute</span>
  </div>

  <div class="row">
    <div class="field"><label>Click sound</label>
      <select id="soundSel"><option value="beep" selected>Beep (digital)</option><option value="wood">Wood block</option><option value="rim">Rim / stick</option><option value="cowbell">Cowbell</option><option value="pulse">Soft pulse</option><option value="clave">Clave</option><option value="hat">Hi-hat tick</option><option value="snap">Snap</option><option value="tock">Sine block (tock)</option><option value="marimba">Marimba</option><option value="mech">Mechanical click</option><option value="triangle">Triangle ding</option><option value="tom">Tom</option><option value="square">Square beep</option><option value="seiko">Seiko two-tone</option></select>
    </div>
    <div class="field"><label>Count voice</label>
      <select id="voiceSel"><option value="m" selected>Default</option><option value="f">Young female</option></select>
    </div>
  </div>

  <div class="vol-block">
    <div class="vol-row"><span class="vol-name"><i style="background:var(--accent2)"></i>Accent</span><input type="range" class="vmini" id="volAccent" min="0" max="100" value="70"><span class="vol-val" id="volAccentV">70</span></div>
    <div class="vol-row"><span class="vol-name"><i style="background:var(--accent)"></i>Normal</span><input type="range" class="vmini" id="volNormal" min="0" max="100" value="45"><span class="vol-val" id="volNormalV">45</span></div>

    parts[0].tempoA = bpm; parts[0].tempoB = bpm;
    selPart=0;
    renderParts(); loadPartSettings();
  }else{
    // leaving parts mode: collapse back to first part only
    parts = [parts[0]];
    parts[0].bars=1; parts[0].tempoA=bpm; parts[0].tempoB=bpm;
    selPart=0;
  }
  renderGroups(); renderDots();
}

// build flat beat list for a part's groups
function buildPattern(groups){
  const pattern=[]; let first=true;
  groups.forEach((g,gi)=>{
    for(let b=0;b<g.beats;b++){
      const subs=[];
      for(let s=0;s<g.subdiv;s++){
        let st; if(s===0) st = first ? 'accent' : (b===0?'accent':'normal'); else st='soft';
        subs.push(st);
      }
      pattern.push({gi, subs}); first=false;
    }
  });
  return pattern;
}
// each part caches a pattern aligned to its groups
function patternFor(part){
  if(!part._pattern || part._pdirty){ part._pattern=buildPattern(part.groups); part._pdirty=false; }
  return part._pattern;
}
function markDirty(part){ part._pdirty=true; }

function voiceNumberFor(pattern,beatIdx,groups){
  let n=0, curGi=-1;
  for(let i=0;i<=beatIdx;i++){
    const p=pattern[i];
    if(p.gi!==curGi){ curGi=p.gi; if(groups[curGi].countMode==='restart') n=0; }
    n++;
  }
  return ((n-1)%9)+1;
}

// ---- sound synthesis ----
let clickSound='beep';
let _noiseBuf=null;
function noiseBuffer(){ if(_noiseBuf)return _noiseBuf; const len=audioCtx.sampleRate*0.2; const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; _noiseBuf=buf; return buf; }
function click(time,state){
  const g0=GAIN[state]; if(g0<=0)return;
  const accent=(state==='accent'), soft=(state==='soft');
  const pitchMul=accent?1.18:(soft?0.85:1.0);
  if(clickSound==='beep'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='sine'; o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=(accent?1600:soft?900:1100);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0,time+0.001); g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    o.start(time); o.stop(time+0.06);
  }else if(clickSound==='pulse'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='sine'; o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime((accent?880:soft?520:660),time); o.frequency.exponentialRampToValueAtTime((accent?660:soft?420:520),time+0.08);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0,time+0.006); g.gain.exponentialRampToValueAtTime(0.0001,time+0.12);
    o.start(time); o.stop(time+0.13);
  }else if(clickSound==='wood'){
    const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer();
    const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=(accent?2200:soft?1400:1800); bp.Q.value=8;
    const g=audioCtx.createGain(); src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(g0*1.1,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.035); src.start(time); src.stop(time+0.05);
    const o=audioCtx.createOscillator(),og=audioCtx.createGain(); o.type='triangle'; o.frequency.value=(accent?900:soft?550:720); o.connect(og); og.connect(audioCtx.destination);
    og.gain.setValueAtTime(g0*0.6,time); og.gain.exponentialRampToValueAtTime(0.0001,time+0.03); o.start(time); o.stop(time+0.04);
  }else if(clickSound==='rim'){
    const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer();
    const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=(accent?3500:2500);
    const g=audioCtx.createGain(); src.connect(hp); hp.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(g0*1.2,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.018); src.start(time); src.stop(time+0.03);
  }else if(clickSound==='cowbell'){
    const f1=(accent?620:soft?480:540)*pitchMul, f2=f1*1.5;
    const g=audioCtx.createGain(); const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f2; bp.Q.value=2; bp.connect(g); g.connect(audioCtx.destination);
    [f1,f2].forEach(f=>{ const o=audioCtx.createOscillator(); o.type='square'; o.frequency.value=f; o.connect(bp); o.start(time); o.stop(time+0.18); });
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0*0.9,time+0.002); g.gain.exponentialRampToValueAtTime(g0*0.25,time+0.05); g.gain.exponentialRampToValueAtTime(0.0001,time+0.18);

  }else if(clickSound==='clave'){
    // bright resonant woodblock — short sine ping with high resonance
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime((accent?2500:soft?1800:2100),time);
    o.frequency.exponentialRampToValueAtTime((accent?2000:soft?1500:1750),time+0.04);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(g0*1.1,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    o.start(time); o.stop(time+0.06);

  }else if(clickSound==='hat'){
    // hi-hat: short high-passed noise with metallic shimmer
    const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer();
    const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
    const g=audioCtx.createGain(); src.connect(hp); hp.connect(g); g.connect(audioCtx.destination);
    const dur=accent?0.06:0.035;
    g.gain.setValueAtTime(g0*0.9,time); g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
    src.start(time); src.stop(time+dur+0.01);

  }else if(clickSound==='snap'){
    // finger snap: filtered noise burst + low body thump
    const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer();
    const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=(accent?2600:2000); bp.Q.value=3;
    const g=audioCtx.createGain(); src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(g0*1.3,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.025);
    src.start(time); src.stop(time+0.04);
    const o=audioCtx.createOscillator(),og=audioCtx.createGain(); o.type='sine'; o.frequency.value=(accent?320:260); o.connect(og); og.connect(audioCtx.destination);
    og.gain.setValueAtTime(g0*0.4,time); og.gain.exponentialRampToValueAtTime(0.0001,time+0.03); o.start(time); o.stop(time+0.04);

  }else if(clickSound==='tock'){
    // warm tuned tock — sine with quick pitch drop, rounder than beep
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime((accent?1000:soft?600:760),time);
    o.frequency.exponentialRampToValueAtTime((accent?500:soft?320:400),time+0.05);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0,time+0.003); g.gain.exponentialRampToValueAtTime(0.0001,time+0.09);
    o.start(time); o.stop(time+0.1);

  }else if(clickSound==='marimba'){
    // mallet: sine fundamental + soft harmonic, gentle decay
    const f=(accent?880:soft?523:660)*1;
    const o=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=f; o2.type='sine'; o2.frequency.value=f*4; o2.detune.value=4;
    const g2=audioCtx.createGain(); g2.gain.value=0.25; o2.connect(g2); g2.connect(g);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0,time+0.004); g.gain.exponentialRampToValueAtTime(0.0001,time+0.25);
    o.start(time); o2.start(time); o.stop(time+0.28); o2.stop(time+0.28);

  }else if(clickSound==='mech'){
    // mechanical wind-up click: very short dry noise transient, lowish band
    const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer();
    const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=(accent?1500:1100); bp.Q.value=1.2;
    const g=audioCtx.createGain(); src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(g0*1.2,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.012);
    src.start(time); src.stop(time+0.02);

  }else if(clickSound==='triangle'){
    // triangle ding: bright metallic ring, long-ish shimmer
    const f=(accent?3200:soft?2400:2800);
    const o=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=f; o2.type='triangle'; o2.frequency.value=f*1.34;
    const g2=audioCtx.createGain(); g2.gain.value=0.4; o2.connect(g2); g2.connect(g);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0*0.8,time+0.003); g.gain.exponentialRampToValueAtTime(0.0001,time+0.4);
    o.start(time); o2.start(time); o.stop(time+0.42); o2.stop(time+0.42);

  }else if(clickSound==='tom'){
    // tom drum: low sine with pitch drop + tiny noise attack
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime((accent?220:soft?150:180),time);
    o.frequency.exponentialRampToValueAtTime((accent?110:soft?80:95),time+0.12);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0,time+0.004); g.gain.exponentialRampToValueAtTime(0.0001,time+0.18);
    o.start(time); o.stop(time+0.2);
    const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer(); const ng=audioCtx.createGain(); src.connect(ng); ng.connect(audioCtx.destination);
    ng.gain.setValueAtTime(g0*0.3,time); ng.gain.exponentialRampToValueAtTime(0.0001,time+0.02); src.start(time); src.stop(time+0.03);

  }else if(clickSound==='square'){
    // harsher square beep that cuts through
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square'; o.frequency.value=(accent?1500:soft?850:1050);
    const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4000;
    o.connect(lp); lp.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0*0.7,time+0.001); g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    o.start(time); o.stop(time+0.06);

  }else if(clickSound==='seiko'){
    // classic digital metronome two-tone: high "pi" on accent, low "po" otherwise
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=(accent?2000:soft?1000:1500);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(g0,time+0.001); g.gain.setValueAtTime(g0,time+0.02); g.gain.exponentialRampToValueAtTime(0.0001,time+0.045);
    o.start(time); o.stop(time+0.05);
  }
}

// ---- voices ----
const voiceBuffers={m:{},f:{}}; let voicesLoading=false;
let voiceType='m', voiceVol=0.10;
const LEADS={m:LEAD_M,f:LEAD_F}; const VOICESET={m:VOICE,f:VOICE_F};
function b64ToArrayBuffer(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer;}
async function loadVoices(){
  if(voicesLoading)return; voicesLoading=true;
  for(const t of ['m','f']){ if(voiceBuffers[t][1])continue; for(let n=1;n<=9;n++){ try{voiceBuffers[t][n]=await audioCtx.decodeAudioData(b64ToArrayBuffer(VOICESET[t][n]));}catch(e){console.error('voice',t,n,e);} } }
  voicesLoading=false;
}
function speakAt(n,time){
  const buf=voiceBuffers[voiceType][n]; if(!buf)return;
  const s=audioCtx.createBufferSource(); s.buffer=buf;
  const g=audioCtx.createGain(); g.gain.value=voiceVol; s.connect(g); g.connect(audioCtx.destination);
  s.start(Math.max(audioCtx.currentTime,time-(LEADS[voiceType][n]||0.02)));
}

// ---- sequencer scheduler ----
// Build a timeline of events when Start is pressed. Each event: {time, state, isMain, voiceN, partIdx, beatRef, subRef, isDown}
let schedule=[], schedPtr=0, seqStartTime=0, seqEndTime=0, totalDur=0, appendPending=false;

function buildSchedule(startAt, skipCountIn){
  schedule=[];
  let t=startAt;
  const ci=skipCountIn?0:(+$('countIn').value);
  // count-in uses first part's first group time signature, plain clicks + voice
  if(ci>0){
    const p0=parts[0]; const g=p0.groups[0]; const beats=g.beats; const tempo=p0.tempoA;
    const spb=60.0/tempo;
    for(let bar=0;bar<ci;bar++){
      for(let b=0;b<beats;b++){
        schedule.push({time:t, state:(b===0?'accent':'normal'), isMain:true, voiceN:((b)%9)+1, isDown:false, countin:true});
        t+=spb;
      }
    }
  }
  // parts
  parts.forEach((part,pi)=>{
    const pattern=patternFor(part);
    const groups=part.groups;
    const bars=part.bars;
    const ramp=(part.tempoB!==part.tempoA);
    // total main-beats across the whole part (for linear ramp distribution)
    const beatsPerBar=pattern.length;
    const totalMainBeats=bars*beatsPerBar;
    let mainBeatCounter=0;
    for(let bar=0;bar<bars;bar++){
      // beat-within-group counter, resets per bar
      let giSeen={};
      for(let bi=0;bi<pattern.length;bi++){
        // tempo for this beat (linear ramp across the part by main-beat index)
        let tempo;
        if(ramp && totalMainBeats>1){
          const frac=mainBeatCounter/(totalMainBeats-1);
          tempo=part.tempoA+(part.tempoB-part.tempoA)*frac;
        }else tempo=part.tempoA;
        const spb=60.0/tempo;
        const beat=pattern[bi]; const sub=beat.subs.length;
        const isFirstOfSeq=(pi===0 && bar===0 && bi===0);
        const gi=beat.gi;
        giSeen[gi]=(giSeen[gi]||0)+1;
        const beatInGroup=giSeen[gi];
        for(let s=0;s<sub;s++){
          const st=beat.subs[s];
          schedule.push({time:t, state:st, isMain:(s===0), voiceN:voiceNumberFor(pattern,bi,groups), partIdx:pi, beatRef:bi, subRef:s, isDown:isFirstOfSeq, tempo:Math.round(tempo), bar:bar+1, bars:bars, gi:gi+1, beatInGroup:beatInGroup});
          t+=spb/sub;
        }
        mainBeatCounter++;
      }
    }
  });
  totalDur=t-startAt;
  seqEndTime=t;
  return t;
}

// append one full pass of the parts (no count-in) starting at startAt; returns end time
function appendSequence(startAt){
  let t=startAt;
  parts.forEach((part,pi)=>{
    const pattern=patternFor(part);
    const groups=part.groups;
    const bars=part.bars;
    const ramp=(part.tempoB!==part.tempoA);
    const beatsPerBar=pattern.length;
    const totalMainBeats=bars*beatsPerBar;
    let mainBeatCounter=0;
    for(let bar=0;bar<bars;bar++){
      let giSeen={};
      for(let bi=0;bi<pattern.length;bi++){
        let tempo;
        if(ramp && totalMainBeats>1){ const frac=mainBeatCounter/(totalMainBeats-1); tempo=part.tempoA+(part.tempoB-part.tempoA)*frac; }
        else tempo=part.tempoA;
        const spb=60.0/tempo;
        const beat=pattern[bi]; const sub=beat.subs.length;
        const isFirstOfSeq=(pi===0 && bar===0 && bi===0);
        const gi=beat.gi;
        giSeen[gi]=(giSeen[gi]||0)+1;
        const beatInGroup=giSeen[gi];
        for(let s=0;s<sub;s++){
          schedule.push({time:t, state:beat.subs[s], isMain:(s===0), voiceN:voiceNumberFor(pattern,bi,groups), partIdx:pi, beatRef:bi, subRef:s, isDown:isFirstOfSeq, tempo:Math.round(tempo), bar:bar+1, bars:bars, gi:gi+1, beatInGroup:beatInGroup});
          t+=spb/sub;
        }
        mainBeatCounter++;
      }
    }
  });
  return t; // exact seam time for the next pass
}

function tick(){
  const now=audioCtx.currentTime;
  while(schedPtr<schedule.length && schedule[schedPtr].time < now+0.12){
    const ev=schedule[schedPtr];
    if(ev.state!=='mute'){
      click(ev.time,ev.state);
      if(ev.isMain) speakAt(ev.voiceN,ev.time);
    }
    const delay=(ev.time-now)*1000;
    setTimeout(()=>onEventVisual(ev),Math.max(0,delay));
    schedPtr++;
  }
  // when we're within 0.3s of the scheduled end, queue what comes next (once)
  if(now > seqEndTime - 0.3 && !appendPending){
    if(!partsMode || $('endMode').value==='loop'){
      appendPending=true;
      seqEndTime=appendSequence(seqEndTime);
      appendPending=false;
      if(schedPtr>5000){ schedule=schedule.slice(schedPtr); schedPtr=0; }
    }else if(schedPtr>=schedule.length && now > seqEndTime){
      stop();
    }
  }
}
function pulseFp(isDown){
  const el=$('fpBpm'); el.classList.remove('pulse-down','pulse-beat'); void el.offsetWidth;
  el.classList.add(isDown?'pulse-down':'pulse-beat');
}
function onEventVisual(ev){
  if(ev.countin){
    $('nowPlaying').innerHTML='Count-in&hellip;';
    setBpmDisplay(parts[0].tempoA);
    const el=$('bpmVal'); el.classList.remove('pulse-down','pulse-beat'); void el.offsetWidth; el.classList.add(ev.state==='accent'?'pulse-down':'pulse-beat');
    // pill during count-in
    $('fpBpm').textContent=Math.round(parts[0].tempoA);
    $('fpPart').textContent='Count-in';
    $('fpDetail').textContent='get ready';
    pulseFp(ev.state==='accent');
    return;
  }
  if(typeof ev.partIdx==='number'){
    if(ev.partIdx!==selPart){ selPart=ev.partIdx; loadPartSettings(); renderParts(); renderGroups(); renderDots(); }
    if(ev.tempo) setBpmDisplay(ev.tempo);
    if(partsMode){
      $('nowPlaying').innerHTML='Playing <b>Part '+(ev.partIdx+1)+'</b>';
      $('fpPart').textContent='Part '+(ev.partIdx+1);
      $('fpDetail').innerHTML='Bar '+ev.bar+'/'+ev.bars+' &middot; G'+ev.gi+' b'+ev.beatInGroup;
    }else{
      $('nowPlaying').innerHTML='';
      $('fpPart').textContent='Metronome';
      $('fpDetail').innerHTML='G'+ev.gi+' b'+ev.beatInGroup;
    }
    highlightPlayingTab(ev.partIdx);
    if(ev.state!=='mute') flash(ev.beatRef,ev.subRef,ev.isDown);
    $('fpBpm').textContent=ev.tempo||Math.round(bpm);
    if(ev.isMain) pulseFp(ev.isDown);
  }
}
function setBpmDisplay(t){ $('bpmVal').firstChild.textContent=Math.round(t); $('bpmSlider').value=Math.round(t); bpm=Math.round(t); }
function highlightPlayingTab(i){ document.querySelectorAll('.part-tab').forEach(t=>t.classList.toggle('playing', +t.dataset.i===i)); }

function start(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(!voiceBuffers.m[1])loadVoices();
  if(!partsMode){ parts[0].bars=1; parts[0].tempoA=bpm; parts[0].tempoB=bpm; }
  playing=true; schedPtr=0;
  buildSchedule(audioCtx.currentTime+0.1);
  $('startBtn').textContent='Stop'; $('startBtn').classList.add('playing');
  $('fpBtn').innerHTML='&#9632;'; $('fpBtn').classList.add('playing');
  $('floatPill').classList.add('show');
  timer=setInterval(tick,25);
}
function stop(){
  playing=false; clearInterval(timer);
  $('startBtn').textContent='Start'; $('startBtn').classList.remove('playing');
  $('fpBtn').classList.remove('playing');
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('flash'));
  document.querySelectorAll('.part-tab').forEach(t=>t.classList.remove('playing'));
  $('nowPlaying').innerHTML='';
  $('floatPill').classList.remove('show');
  $('fpNext').style.display='none';
}

// ---- controls ----
// live retune in simple mode: rebuild upcoming schedule at new tempo seamlessly
function retuneSimple(){
  if(!playing || partsMode || !audioCtx) return;
  parts[0].bars=1; parts[0].tempoA=bpm; parts[0].tempoB=bpm; markDirty(parts[0]);
  const now=audioCtx.currentTime;
  const horizon=now+0.13; // keep events already near the audio clock
  // find the cut point: first event strictly after the horizon
  let keep=[];
  for(let i=0;i<schedule.length;i++){
    if(schedule[i].time<=horizon) keep.push(schedule[i]); else break;
  }
  // determine restart time: continue from last kept event + its step at NEW tempo
  let restartAt;
  if(keep.length){
    const last=keep[keep.length-1];
    const pat=patternFor(parts[0]);
    const sub=pat[last.beatRef] ? pat[last.beatRef].subs.length : 1;
    restartAt=last.time + (60.0/bpm)/sub;
  }else{
    restartAt=horizon;
  }
  schedule=keep;
  // re-append fresh passes from restartAt
  seqEndTime=appendSequence(restartAt);
  // reset pointer to the first not-yet-played event
  schedPtr=0;
  while(schedPtr<schedule.length && schedule[schedPtr].time < now) schedPtr++;
  appendPending=false;
}
let retuneTimer=null;
function retuneSoon(){ if(retuneTimer)clearTimeout(retuneTimer); retuneTimer=setTimeout(retuneSimple,70); }
$('themeSel').onchange=e=>{ document.body.setAttribute('data-theme', e.target.value); };
$('startBtn').onclick=()=>{ if(playing){ setlistActive=null; stop(); } else start(); };
$('fpBtn').onclick=()=>{ if(playing){ setlistActive=null; stop(); } else start(); };
$('bpmSlider').oninput=e=>{ setBpm(+e.target.value); if(playing){ retuneSoon(); } else { parts[selPart].tempoA=+e.target.value; loadPartSettings(); } };
document.querySelectorAll('.bpm-btns button').forEach(b=>b.onclick=()=>{ setBpm(bpm+(+b.dataset.d)); if(playing){ retuneSoon(); } else { parts[selPart].tempoA=bpm; loadPartSettings(); } });
$('soundSel').onchange=e=>{ clickSound=e.target.value; if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); click(audioCtx.currentTime+0.02,'accent'); };
function bindVol(id,state,lblId){ $(id).oninput=e=>{ GAIN[state]=(+e.target.value)/100; $(lblId).textContent=e.target.value; if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); click(audioCtx.currentTime+0.02,state); }; }
bindVol('volAccent','accent','volAccentV'); bindVol('volNormal','normal','volNormalV'); bindVol('volSoft','soft','volSoftV');
$('voiceSel').onchange=e=>{ voiceType=e.target.value; if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); loadVoices(); };
$('volSlider').oninput=e=>{ voiceVol=(+e.target.value)/100; $('volLbl').textContent=e.target.value; if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); if(!voiceBuffers[voiceType][1])loadVoices(); else speakAt(1,audioCtx.currentTime+0.02); };
let taps=[];
$('tapBtn').onclick=()=>{ const now=performance.now(); taps=taps.filter(t=>now-t<2000); taps.push(now); if(taps.length>=2){ let sum=0; for(let i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1]; setBpm(Math.round(60000/(sum/(taps.length-1)))); if(playing){ retuneSimple(); } else { parts[selPart].tempoA=bpm; loadPartSettings(); } } };

// ================= LIBRARY: songs + setlists =================
const LS_SONGS='metro_songs_v1', LS_SETS='metro_sets_v1';
function lsGet(k,def){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;} }

let songs=lsGet(LS_SONGS,{});   // {name: stateObj}
let setlists=lsGet(LS_SETS,{}); // {name: [songName,...]}
let curSet=null;

// capture entire app state
function captureState(){
  return {
    v:1,
    partsMode, parts:JSON.parse(JSON.stringify(parts.map(p=>({bars:p.bars,tempoA:p.tempoA,tempoB:p.tempoB,groups:p.groups})))),
    selPart, bpm,
    clickSound, voiceType, voiceVol,
    gain:{...GAIN},
    theme:$('themeSel').value,
    countIn:$('countIn').value, endMode:$('endMode').value,
    // also store per-part dot patterns (states), since defaults rebuild otherwise
    patterns: parts.map(p=>{ const pat=patternFor(p); return pat.map(b=>b.subs.slice()); })
  };
}
// restore a captured state
function restoreState(s){
  if(!s)return;
  partsMode = !!s.partsMode;
  parts = s.parts.map(p=>({bars:p.bars,tempoA:p.tempoA,tempoB:p.tempoB,groups:p.groups,_pdirty:true}));
  // reapply saved dot patterns over rebuilt ones
  if(s.patterns){ parts.forEach((p,i)=>{ const pat=patternFor(p); if(s.patterns[i]) pat.forEach((b,bi)=>{ if(s.patterns[i][bi]) b.subs=s.patterns[i][bi].slice(); }); }); }
  selPart=Math.min(s.selPart||0, parts.length-1);
  bpm=s.bpm||120; setBpm(bpm);
  clickSound=s.clickSound||'beep'; $('soundSel').value=clickSound;
  voiceType=s.voiceType||'m'; $('voiceSel').value=voiceType;
  voiceVol=(s.voiceVol!=null)?s.voiceVol:0.10; $('volSlider').value=Math.round(voiceVol*100); $('volLbl').textContent=Math.round(voiceVol*100);
  if(s.gain){ Object.assign(GAIN,s.gain); $('volAccent').value=Math.round(GAIN.accent*100); $('volAccentV').textContent=Math.round(GAIN.accent*100); $('volNormal').value=Math.round(GAIN.normal*100); $('volNormalV').textContent=Math.round(GAIN.normal*100); $('volSoft').value=Math.round(GAIN.soft*100); $('volSoftV').textContent=Math.round(GAIN.soft*100); }
  if(s.theme){ $('themeSel').value=s.theme; document.body.setAttribute('data-theme',s.theme); }
  if(s.countIn!=null)$('countIn').value=s.countIn;
  if(s.endMode)$('endMode').value=s.endMode;
  // reflect parts mode UI
  document.querySelectorAll('.partsUI').forEach(el=>el.style.display=partsMode?'':'none');
  $('simpleBar').style.display=partsMode?'none':'';
  $('groupsHead').textContent=partsMode?'Beat groups (this part)':'Beat groups';
  renderParts(); loadPartSettings(); renderGroups(); renderDots();
}

// ---- songs UI ----
function refreshSongList(){
  const sel=$('songList'); sel.innerHTML='';
  Object.keys(songs).sort().forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
}
function persistSongs(){ const ok=lsSet(LS_SONGS,songs); if(!ok)flash_warn(); }
let warned=false;
function flash_warn(){ if(warned)return; warned=true; alert('Saved in this session, but your browser is blocking permanent storage (this happens inside the preview). Open the downloaded HTML file directly and saves will persist. Export to a file as a backup.'); }

$('saveSong').onclick=()=>{
  let name=$('songName').value.trim();
  if(!name){ name='Song '+(Object.keys(songs).length+1); }
  songs[name]=captureState(); persistSongs(); refreshSongList(); $('songName').value='';
  $('songList').value=name;
};
$('loadSong').onclick=()=>{ const n=$('songList').value; if(!n||!songs[n])return; restoreState(songs[n]); if(playing){ stop(); start(); } };
$('songList').ondblclick=()=>{ $('loadSong').click(); };
$('renameSong').onclick=()=>{ const n=$('songList').value; if(!n)return; const nn=prompt('Rename song:',n); if(!nn||nn===n)return; songs[nn]=songs[n]; delete songs[n]; persistSongs(); refreshSongList(); $('songList').value=nn; };
$('delSong').onclick=()=>{ const n=$('songList').value; if(!n)return; if(!confirm('Delete "'+n+'"?'))return; delete songs[n]; persistSongs(); refreshSongList(); };

// ---- export / import ----
function downloadJSON(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('exportSong').onclick=()=>{ const n=$('songList').value; if(!n)return; downloadJSON({type:'metro-song',name:n,data:songs[n]}, n.replace(/[^\w-]+/g,'_')+'.metro.json'); };
$('exportAll').onclick=()=>{ downloadJSON({type:'metro-library',songs,setlists}, 'metronome_library.metro.json'); };
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(obj.type==='metro-song' && obj.data){ songs[obj.name||('Imported '+Date.now())]=obj.data; }
      else if(obj.type==='metro-library'){ Object.assign(songs,obj.songs||{}); Object.assign(setlists,obj.setlists||{}); }
      else { alert('Not a recognized metronome file.'); return; }
      persistSongs(); lsSet(LS_SETS,setlists); refreshSongList(); refreshSetSelect();
      alert('Import complete.');
    }catch(err){ alert('Could not read file: '+err.message); }
  };
  r.readAsText(f); e.target.value='';
};

// ---- library tabs ----
$('tabSongs').onclick=()=>{ $('songsPanel').style.display=''; $('setsPanel').style.display='none'; $('libTitle').textContent='Library'; };
$('tabSets').onclick=()=>{ $('songsPanel').style.display='none'; $('setsPanel').style.display=''; $('libTitle').textContent='Setlists'; refreshSetSelect(); };

// ---- setlists UI ----
function persistSets(){ if(!lsSet(LS_SETS,setlists))flash_warn(); }
function refreshSetSelect(){
  const sel=$('setSelect'); sel.innerHTML='';
  Object.keys(setlists).sort().forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
  if(curSet && setlists[curSet]) sel.value=curSet; else curSet=sel.value||null;
  refreshSetSongs();
}
function refreshSetSongs(){
  const sel=$('setSongs'); sel.innerHTML='';
  const list=curSet?setlists[curSet]:[];
  (list||[]).forEach((n,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=(i+1)+'. '+n; sel.appendChild(o); });
}
$('setSelect').onchange=e=>{ curSet=e.target.value; refreshSetSongs(); };
$('newSet').onclick=()=>{ const n=prompt('New setlist name:'); if(!n)return; setlists[n]=[]; curSet=n; persistSets(); refreshSetSelect(); };
$('delSet').onclick=()=>{ if(!curSet)return; if(!confirm('Delete setlist "'+curSet+'"?'))return; delete setlists[curSet]; curSet=null; persistSets(); refreshSetSelect(); };
$('addToSet').onclick=()=>{
  const n=$('songList').value; if(!n){alert('Select a song first.');return;}
  if(!curSet){ const setName=prompt('No setlist selected. Name a new setlist:'); if(!setName)return; setlists[setName]=[]; curSet=setName; }
  setlists[curSet].push(n); persistSets(); $('tabSets').click();
};
$('setUp').onclick=()=>{ const i=+$('setSongs').value; if(!curSet||isNaN(i)||i<=0)return; const a=setlists[curSet]; [a[i-1],a[i]]=[a[i],a[i-1]]; persistSets(); refreshSetSongs(); $('setSongs').value=i-1; };
$('setDown').onclick=()=>{ const i=+$('setSongs').value; if(!curSet||isNaN(i))return; const a=setlists[curSet]; if(i>=a.length-1)return; [a[i+1],a[i]]=[a[i],a[i+1]]; persistSets(); refreshSetSongs(); $('setSongs').value=i+1; };
$('setRemove').onclick=()=>{ const i=+$('setSongs').value; if(!curSet||isNaN(i))return; setlists[curSet].splice(i,1); persistSets(); refreshSetSongs(); };

// ---- setlist playback ----
$('playSet').onclick=()=>{
  if(!curSet || !setlists[curSet] || !setlists[curSet].length){ alert('This setlist is empty.'); return; }
  setlistActive=setlists[curSet].slice(); setlistPos=0;
  loadSetlistSong(0);
  if(playing) stop();
  start();
  $('fpNext').style.display=(setlistActive.length>1)?'':'none';
};
function loadSetlistSong(i){
  const name=setlistActive[i];
  if(songs[name]) restoreState(songs[name]);
  $('fpNext').style.display = (i<setlistActive.length-1) ? '' : 'none';
}
$('fpNext').onclick=()=>{
  if(!setlistActive)return;
  if(setlistPos<setlistActive.length-1){
    setlistPos++; loadSetlistSong(setlistPos);
    stop(); start();
    $('fpNext').style.display=(setlistPos<setlistActive.length-1)?'':'none';
  }
};

// init library lists
refreshSongList(); refreshSetSelect();

// init
renderParts(); loadPartSettings(); renderGroups(); renderDots();
</script>
